[package]
name = "iris"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted personal AI agent that wraps the official Claude Code, Codex, Gemini CLI, and OpenCode CLIs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["agent", "assistant", "self-hosted", "llm", "cli"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
aes-gcm = "0.11"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "ws", "tokio", "query"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
getrandom = "0.4.3"
hkdf = "0.13"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc = "0.2.190"
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
# Blacks out private details in the agent's screenshots on Iris's side
# (decode, paint, encode), never inside the page.
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "signal", "net", "fs"] }
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Iris's browser end to end: Playwright MCP and Chromium installed the
      # way the app does (the pinned PLAYWRIGHT_MCP_VERSION from npm, then
      # Playwright's downloads). playwright-mcp-bump.yml runs the same test
      # on each new release before it moves the pin.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          cargo build
          mkdir -p "$RUNNER_TEMP/engines"
          chmod 755 "$RUNNER_TEMP/engines"
          ./target/debug/iris engines install browser --dir "$RUNNER_TEMP/engines"
          IRIS_REAL_BROWSER="$RUNNER_TEMP/engines" cargo test real_playwright -- --ignored
      # The phone app (web/js) has no build step; its tests use node's own
      # runner and no packages.
      - run: node --test 'tests/web/*.test.mjs'

  msrv:
    # Builds with the oldest Rust that Cargo.toml's rust-version promises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked

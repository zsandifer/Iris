name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The browser end-to-end tests (web basics, CAPTCHAs, sign-ins) use
      # the runner's Chrome and fail rather than skip without it.
      - run: cargo test
        env:
          IRIS_REQUIRE_BROWSER: "1"
      # The phone app (web/js) has no build step; its tests use node's own
      # runner and no packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test 'tests/web/*.test.mjs'

  msrv:
    # Builds with the oldest Rust that Cargo.toml's rust-version promises.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --all-targets --locked
